# Builds an installable debug APK in the cloud, so nothing has to be installed locally.
#
# Push this project to GitHub and the workflow runs on its own. The finished APK is attached
# to a GitHub Release, which gives a direct download link that works in a phone browser.
#
# It also doubles as a compiler check. The project has never been built on a local machine,
# so the first run here is the first real compile; if it fails, the log says exactly where.
#
# Step-by-step instructions for using this: see GET_AN_APK.md in the project root.

name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      # AGP 8.7 requires JDK 17. The runner's default JDK varies, so pin it.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # compileSdk/targetSdk are 35. The runner image usually has this already; asking
      # explicitly also accepts the SDK licences, which a headless build needs.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # gradle/wrapper/gradle-wrapper.jar is not committed, so ./gradlew cannot be used.
      # This action supplies Gradle 8.9 directly and caches the dependency downloads.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        continue-on-error: true
        with:
          gradle-version: '8.9'

      # Safety net: if the step above fails or leaves gradle off PATH, install it by hand
      # so the build still runs. Slower, because there is no dependency cache.
      - name: Confirm Gradle is available
        run: |
          if command -v gradle >/dev/null 2>&1; then
            gradle --version
          else
            echo "::warning::setup-gradle left no gradle on PATH; installing 8.9 directly."
            curl -sSLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
            unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
            echo "$HOME/gradle-dist/gradle-8.9/bin" >> "$GITHUB_PATH"
          fi

      # Tee'd to a file so a failure can be handed over whole, rather than pieced together
      # from a scrolled web view. pipefail keeps the step's exit code honest.
      - name: Build the debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload the full build log if the build failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Collect the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
             "out/AllVideoDownloader-${{ github.run_number }}.apk"
          ls -lh out

      # Downloadable from the run page, but only as a zip and only when signed in.
      - name: Upload the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AllVideoDownloader-apk
          path: out/*.apk
          if-no-files-found: error

      # The useful one: a release asset is a plain .apk link a phone can open directly.
      - name: Attach the APK to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" out/*.apk \
            --title "All Video Downloader - build ${{ github.run_number }}" \
            --notes "Debug APK built from ${{ github.sha }}. Requires Android 10 or newer."
